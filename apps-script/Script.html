<script>
/* SRU Rooms Digital Twin — client logic (v2.1, HtmlService + google.script.run · 3 switchable views · v2.3 floor rule) */
(function(){
"use strict";
var LOGO_BASE = "https://ictsru.github.io/RDT/assets/logos/";
var ITOC_HUB  = "https://ictsru.github.io/ITOC/#forms";
var CATEGORIES = ["قاعات المحاضرات","قاعات الاختبار","القاعات الدراسية","الفصول الدراسية","قاعات الاجتماعات","أخرى"];
var state = { rooms:[], cat:"الكل", isAdmin:false, email:"", photos:[], devices:[], view:"console", building:"", floor:"" };

var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},2200);}
function splitList(s){return String(s||"").split(/[\n،,|]+/).map(function(x){return x.trim();}).filter(Boolean);}

// devices stored as JSON array [{name,model,ip,specs:[[k,v]]}]
function normDev(d){ d=d||{}; return {name:d.name||"",model:d.model||"",ip:d.ip||"",
  specs:Array.isArray(d.specs)?d.specs.filter(function(p){return p&&p.length;}):[]}; }
function parseDevices(s){ s=String(s||"").trim(); if(!s) return [];
  if(s.charAt(0)==="["){ try{var a=JSON.parse(s); if(Array.isArray(a)) return a.map(normDev);}catch(e){} }
  return splitList(s).map(function(n){return {name:n,model:"",ip:"",specs:[]};}); }

// google.script.run as a promise
function run(fn){ var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,args);
  }); }

function wireLogo(img,url,txt){ if(!url){img.replaceWith(fb(txt));return;}
  img.src=url; img.onerror=function(){img.replaceWith(fb(txt));}; }
function fb(t){var s=document.createElement("span");s.className="logo-fallback";s.textContent=t;return s;}

// ===== bootstrap (identity + data from server) ======================
function bootstrap(){
  run("getBootstrap").then(function(b){
    if(!b || !b.ok){
      $("#gate-err").textContent = "يُسمح بالدخول فقط بحساب الجامعة @"+(b&&b.domain||"sr.edu.sa")+".";
      return;
    }
    state.email=b.email; state.isAdmin=!!b.isAdmin; state.rooms=b.rooms||[];
    $("#gate-email").textContent = b.email;
    $("#gate-err").textContent = "";
    enterApp();
    if(b.migration && b.migration.changed){ toast("تم تعيين الدور تلقائياً لـ "+b.migration.changed+" قاعة حسب رقمها"); }
    else if(b.migration && b.migration.error){ toast("تعذّر تعيين الأدوار تلقائياً: "+b.migration.error); }
  }).catch(function(e){
    $("#gate-err").textContent = "تعذّر تحميل البيانات من الخادم. أعد تحميل الصفحة.";
  });
}
function enterApp(){
  $("#gate").classList.add("hidden");
  $("#who-email").textContent = state.email;
  $("#addRoomBtn").classList.toggle("hidden", !state.isAdmin);
  renderKPIs(); renderSwitch(); renderTabs(); render();
}

// ===== render =======================================================
function renderTabs(){
  var counts={}; state.rooms.forEach(function(r){counts[r.Category]=(counts[r.Category]||0)+1;});
  var tabs=[{k:"الكل",n:state.rooms.length}].concat(CATEGORIES.map(function(c){return {k:c,n:counts[c]||0};}));
  $("#tabs").innerHTML = tabs.map(function(t){
    return '<button class="tab'+(state.cat===t.k?' active':'')+'" data-cat="'+esc(t.k)+'">'
      +esc(t.k)+' <span class="count">'+t.n+'</span></button>';
  }).join("");
  $$("#tabs .tab").forEach(function(b){b.onclick=function(){state.cat=b.dataset.cat;renderTabs();render();};});
}
function currentList(){
  var q=($("#q").value||"").trim().toLowerCase();
  var fb=(state.view==="explorer")?"":$("#fBuilding").value, fg=$("#fGender").value, fs=$("#fStatus").value;
  return state.rooms.filter(function(r){
    if(state.cat!=="الكل" && r.Category!==state.cat) return false;
    if(fb && r.Building!==fb) return false;
    if(fg && r.Gender!==fg) return false;
    if(fs && r.Status!==fs) return false;
    if(q){ var hay=(r.RoomName+" "+r.Building+" "+r.Devices+" "+r.SourceType+" "+r.RoomID+" "+r.Floor).toLowerCase();
           if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function firstPhoto(r){var p=splitList(r.PhotoURLs);return p.length?p[0]:"";}

// ===== v2.1 — three switchable views ================================
var CATCLS = {"قاعات المحاضرات":"c-lec","قاعات الاختبار":"c-exam","القاعات الدراسية":"c-study",
              "الفصول الدراسية":"c-class","قاعات الاجتماعات":"c-meet","أخرى":"c-other"};
function catCls(c){ return CATCLS[c]||"c-other"; }
function num(v){ var n=parseInt(v,10); return isNaN(n)?0:n; }
function fmt(n){ return Number(n).toLocaleString("en-US"); }
function chip(c){ return '<span class="cchip '+catCls(c)+'">'+esc(c||"—")+'</span>'; }
function gpill(g){ return g==="طالبات" ? '<span class="gpill fem">طالبات</span>' : esc(g||"—"); }
function spill(s){ return '<span class="spill '+(s==="نشطة"?"on":"off")+'">'+esc(s||"—")+'</span>'; }

function loadView(){ try{ return localStorage.getItem("rdt_view"); }catch(e){ return null; } }
function saveView(v){ try{ localStorage.setItem("rdt_view", v); }catch(e){} }

function sorted(list){
  var s=$("#fSort").value, a=list.slice();
  if(s==="name") a.sort(function(x,y){return String(x.RoomName).localeCompare(String(y.RoomName),"ar");});
  else if(s==="building") a.sort(function(x,y){return String(x.Building).localeCompare(String(y.Building))||num(y.Capacity)-num(x.Capacity);});
  else a.sort(function(x,y){return num(y.Capacity)-num(x.Capacity);});
  return a;
}

function renderKPIs(){
  var R=state.rooms, act=R.filter(function(r){return r.Status==="نشطة";}).length;
  var blds={}; R.forEach(function(r){ if(r.Building) blds[r.Building]=1; });
  var cap=R.reduce(function(s,r){return s+num(r.Capacity);},0);
  var withDev=R.filter(function(r){return parseDevices(r.Devices).length>0;}).length;
  var withPh=R.filter(function(r){return splitList(r.PhotoURLs).length>0;}).length;
  var k=[
    {l:"إجمالي القاعات",v:fmt(R.length),n:"في "+Object.keys(blds).length+" مبانٍ"},
    {l:"قاعات نشطة",v:fmt(act),n:R.length?((act/R.length*100).toFixed(1)+"% من الإجمالي"):"—"},
    {l:"غير نشطة",v:fmt(R.length-act),n:"تحتاج مراجعة",w:(R.length-act)>0},
    {l:"السعة الإجمالية",v:fmt(cap),n:"مقعد"},
    {l:"قاعات بأجهزة مسجّلة",v:fmt(withDev),n:"من "+fmt(R.length)},
    {l:"قاعات بصور",v:fmt(withPh),n:"من "+fmt(R.length)}
  ];
  $("#kpis").innerHTML=k.map(function(x){
    return '<div class="kpi'+(x.w?' warn':'')+'"><span class="l">'+esc(x.l)+'</span><span class="v">'+esc(x.v)+'</span><span class="n">'+esc(x.n)+'</span></div>';
  }).join("");
}

function renderSwitch(){
  $$(".vbtn").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.view===state.view?"true":"false"); });
}
function setView(v){ state.view=v; saveView(v); renderSwitch(); render(); }

function render(){
  if(!$("#fBuilding").dataset.ready){
    var bs=Array.from(new Set(state.rooms.map(function(r){return r.Building;}))).filter(Boolean).sort();
    $("#fBuilding").innerHTML='<option value="">كل المباني</option>'+bs.map(function(b){return '<option>'+esc(b)+'</option>';}).join("");
    $("#fBuilding").dataset.ready="1";
  }
  var list=sorted(currentList());
  $("#count").textContent=list.length+" قاعة";
  // the building filter is driven by the building tabs in the explorer view
  $("#fBuilding").disabled = state.view==="explorer";
  if(state.view==="explorer") renderExplorer(list);
  else if(state.view==="gallery") renderGallery(list);
  else renderConsole(list);
}
function bindOpen(sel){ $$(sel).forEach(function(b){ b.onclick=function(){ openDetail(b.dataset.id); }; }); }
function emptyMsg(){ return '<div class="empty">لا توجد قاعات مطابقة للبحث أو الفلاتر.</div>'; }

// ---- A · لوحة التشغيل ----
function renderConsole(list){
  if(!list.length){ $("#viewHost").innerHTML=emptyMsg(); return; }
  var rows=list.map(function(r){
    var d=parseDevices(r.Devices).length;
    return '<tr>'
      +'<td><button type="button" class="linkbtn" data-id="'+esc(r.RoomID)+'">'+esc(r.RoomName)+'</button></td>'
      +'<td>'+chip(r.Category)+'</td>'
      +'<td class="ltr">'+esc(r.Building||"—")+'</td>'
      +'<td'+(r.Floor?'':' class="muted"')+'>'+esc(r.Floor||"—")+'</td>'
      +'<td>'+gpill(r.Gender)+'</td>'
      +'<td><b>'+esc(r.Capacity||"—")+'</b></td>'
      +'<td'+(d?'':' class="muted"')+'>'+(d?d:"—")+'</td>'
      +'<td>'+spill(r.Status)+'</td></tr>';
  }).join("");
  $("#viewHost").innerHTML='<div class="tcard"><div class="twrap"><table class="rtable"><thead><tr>'
    +'<th scope="col">القاعة</th><th scope="col">التصنيف</th><th scope="col">المبنى</th><th scope="col">الدور</th>'
    +'<th scope="col">الفئة</th><th scope="col">السعة</th><th scope="col">الأجهزة</th><th scope="col">الحالة</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  bindOpen("#viewHost .linkbtn");
}

// ---- B · مستكشف المباني (v2.2: main buildings + fixed floors + female highlight) ----
var MAIN_BLDS=["Part 1","Part 2","Part 3","Part 4","Part 5","Conference Hall"];
var FLOORS=["الأرضي","الأول","الثاني","الثالث"];
function baseBld(b){ return String(b||"").replace(/\s+/g," ").replace(/\s*-\s*(Female|Male)\s*$/i,"").trim(); }
function hasFloors(b){ return /^Part\s*\d/i.test(b); }
function isFemale(r){ return r.Gender==="طالبات"; }

function renderExplorer(list){
  var counts={}; state.rooms.forEach(function(r){ var b=baseBld(r.Building); if(b) counts[b]=(counts[b]||0)+1; });
  var blds=MAIN_BLDS.filter(function(b){return counts[b];})
    .concat(Object.keys(counts).filter(function(b){return MAIN_BLDS.indexOf(b)<0;}).sort());
  if(!blds.length){ $("#viewHost").innerHTML=emptyMsg(); return; }
  if(!state.building || !counts[state.building]) state.building=blds[0];

  var tabs='<nav class="bldtabs" aria-label="المباني الرئيسية">'+blds.map(function(b){
    return '<button type="button" class="btab" data-b="'+esc(b)+'" aria-pressed="'+(b===state.building?"true":"false")+'">'
      +'<span dir="ltr">'+esc(b)+'</span><span class="n">'+counts[b]+'</span></button>';
  }).join("")+'</nav>';

  var inB=list.filter(function(r){return baseBld(r.Building)===state.building;});

  // fixed floor tabs for Part 1–5 (counts before the floor filter is applied)
  var floorNav="", floorHint="";
  if(hasFloors(state.building)){
    var fc={}; inB.forEach(function(r){ var k=FLOORS.indexOf(r.Floor)>=0?r.Floor:"__none"; fc[k]=(fc[k]||0)+1; });
    var opts=[{k:"",t:"كل الأدوار",n:inB.length}].concat(FLOORS.map(function(f){return {k:f,t:"الدور "+f,n:fc[f]||0};}));
    if(fc.__none) opts.push({k:"__none",t:"غير محدد",n:fc.__none});
    if(state.floor && !opts.some(function(o){return o.k===state.floor;})) state.floor="";
    floorNav='<nav class="floortabs" aria-label="الأدوار">'+opts.map(function(o){
      return '<button type="button" class="ftab'+(o.n?'':' zero')+'" data-f="'+esc(o.k)+'" aria-pressed="'+(o.k===state.floor?"true":"false")+'">'
        +esc(o.t)+'<span class="n">'+o.n+'</span></button>';
    }).join("")+'</nav>';
    if(inB.length && fc.__none===inB.length) floorHint='<p class="fhint">لم يُحدَّد دور أي قاعة في هذا المبنى بعد — افتح القاعة واختر «الدور» لتظهر في تبويب دورها.</p>';
    if(state.floor==="__none") inB=inB.filter(function(r){return FLOORS.indexOf(r.Floor)<0;});
    else if(state.floor) inB=inB.filter(function(r){return r.Floor===state.floor;});
  } else { state.floor=""; }

  var capB=inB.reduce(function(s,r){return s+num(r.Capacity);},0);
  var fem=inB.filter(isFemale).length;
  var floorLbl = state.floor==="__none" ? " · غير محدد الدور" : (state.floor ? " · الدور "+state.floor : "");
  var head='<div class="bhead"><div><h2><span dir="ltr">'+esc(state.building)+'</span>'+esc(floorLbl)+' · '+inB.length+' قاعة</h2>'
    +'<p>مساحة كل قاعة تتناسب مع سعتها الفعلية · السعة '+fmt(capB)+' مقعد'
    +(inB.length?' · <span class="femtxt">طالبات '+fem+'</span> · طلاب وغيرهم '+(inB.length-fem):'')+'</p></div></div>';

  var legend='<div class="legend"><span class="lg-fem"><i></i>قاعات الطالبات</span><span class="lg-sep" aria-hidden="true"></span>'
    +CATEGORIES.map(function(c){return '<span class="lg-cat '+catCls(c)+'"><i></i>'+esc(c)+'</span>';}).join("")
    +'<span class="inact"><i></i>غير نشطة</span></div>';

  function tile(r){
    var cap=Math.max(num(r.Capacity),1), off=r.Status!=="نشطة", f=isFemale(r);
    return '<button type="button" class="tile '+catCls(r.Category)+(f?' fem':'')+(off?' inactive':'')+'" style="flex:'+cap+' 1 0px" data-id="'+esc(r.RoomID)+'"'
      +' aria-label="'+esc(r.RoomName+" — "+(r.Category||"")+" — "+(r.Gender||"")+" — "+(r.Capacity||"؟")+" مقعد"+(off?" — غير نشطة":""))+'">'
      +'<span class="tn">'+esc(r.RoomName)+'</span>'
      +'<span class="tmeta"><span class="tcat">'+esc(r.Category||"")+'</span>'+(f?'<span class="tg">طالبات</span>':'')+'</span>'
      +'<span class="tc">'+ICN.users+esc(r.Capacity||"—")+' مقعد'+(off?' · غير نشطة':'')+'</span></button>';
  }
  var plan;
  if(!inB.length){ plan='<div class="empty">لا توجد قاعات في هذا الاختيار.</div>'; }
  else {
    var half=Math.ceil(inB.length/2);
    plan='<div class="plan" aria-label="مخطط المبنى"><div class="wing">'+inB.slice(0,half).map(tile).join("")+'</div>'
      +'<div class="corridor" aria-hidden="true">← الممر الرئيسي →</div>'
      +'<div class="wing">'+inB.slice(half).map(tile).join("")+'</div></div>';
  }
  var byCat={}; inB.forEach(function(r){ byCat[r.Category]=(byCat[r.Category]||0)+1; });
  var stats='<div class="bstats">'+Object.keys(byCat).map(function(c){
    return '<div class="bstat"><div class="l">'+esc(c)+'</div><div class="v">'+byCat[c]+'</div></div>';
  }).join("")+'</div>';

  $("#viewHost").innerHTML=tabs+floorNav+head+floorHint+legend+plan+stats;
  $$("#viewHost .btab").forEach(function(b){ b.onclick=function(){ state.building=b.dataset.b; state.floor=""; render(); }; });
  $$("#viewHost .ftab").forEach(function(b){ b.onclick=function(){ state.floor=b.dataset.f; render(); }; });
  bindOpen("#viewHost .tile");
}

// ---- C · المعرض البصري ----
function renderGallery(list){
  if(!list.length){ $("#viewHost").innerHTML=emptyMsg(); return; }
  $("#viewHost").innerHTML='<div class="ggrid">'+list.map(function(r){
    var ph=firstPhoto(r), devs=parseDevices(r.Devices);
    var dc=devs.length? devs.slice(0,3).map(function(d){return '<span class="dchip">'+esc(d.name||"جهاز")+'</span>';}).join("")
      +(devs.length>3?'<span class="dchip">+'+(devs.length-3)+'</span>':'')
      : '<span class="dchip none">لا أجهزة مسجّلة بعد</span>';
    return '<article class="gcard">'
      +'<div class="ph"'+(ph?' style="background-image:url(\''+esc(ph)+'\')"':'')+'>'
        +(ph?'':'<svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>')
        +'<span class="cap">'+ICN.users+esc(r.Capacity||"—")+'</span>'+spill(r.Status)+chip(r.Category)
      +'</div>'
      +'<div class="gb"><div><h3>'+esc(r.RoomName)+'</h3>'
        +'<p class="sub"><span dir="ltr">'+esc(r.Building||"—")+'</span>'+(r.Floor?' · الدور '+esc(r.Floor):'')+' · '+gpill(r.Gender)+'</p></div>'
        +'<div class="dchips" aria-label="الأجهزة">'+dc+'</div>'
        +'<button type="button" class="gopen" data-id="'+esc(r.RoomID)+'">عرض التوأم الرقمي'
        +'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>'
      +'</div></article>';
  }).join("")+'</div>';
  bindOpen("#viewHost .gopen");
}

function openDetail(id){
  var r=state.rooms.filter(function(x){return x.RoomID===id;})[0]; if(!r) return;
  var photos=splitList(r.PhotoURLs), devices=parseDevices(r.Devices);
  $("#detailTitle").textContent=r.RoomName;
  var html="";
  html+='<div class="gallery">'+(photos.length? photos.map(function(u){
      return '<img src="'+esc(u)+'" alt="" onclick="window.open(this.src)">';}).join("")
    : '<div class="ph">لا توجد صور بعد</div>')+'</div>';
  html+='<div class="detail-grid">'
    +cell("المعرّف",r.RoomID)+cell("التصنيف",r.Category)
    +cell("النوع (المصدر)",r.SourceType)+cell("المبنى",r.Building)
    +cell("الدور",r.Floor)+cell("السعة",r.Capacity)
    +cell("الفئة",r.Gender)+cell("الحالة",r.Status)
    +cell("آخر تحديث",(r.UpdatedAt||"-"))+cell("بواسطة",(r.UpdatedBy||"-"))
  +'</div>';
  html+='<div class="section-title">'+ICN.cpu+'الأجهزة والتقنيات ('+devices.length+')</div>';
  if(devices.length){
    html+=devices.map(function(d){
      var rows='';
      if(d.model) rows+='<tr><td>الموديل</td><td>'+esc(d.model)+'</td></tr>';
      if(d.ip)    rows+='<tr><td>عنوان IP</td><td><span class="en">'+esc(d.ip)+'</span></td></tr>';
      (d.specs||[]).forEach(function(p){ if(p[0]||p[1]) rows+='<tr><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>'; });
      return '<div class="dev-card"><div class="dev-head">'+ICN.cpu+'<span>'+esc(d.name||"جهاز")+'</span></div>'
        +(rows?'<table class="specs-table"><tbody>'+rows+'</tbody></table>':'<div class="hint">لا توجد مواصفات مسجّلة.</div>')+'</div>';
    }).join("");
  } else { html+='<div class="hint">لم تُسجّل أجهزة لهذه القاعة بعد.</div>'; }
  if(r.Notes){ html+='<div class="section-title">'+ICN.note+'ملاحظات</div><div class="hint">'+esc(r.Notes)+'</div>'; }
  $("#detailBody").innerHTML=html;
  $("#detailEdit").classList.toggle("hidden",!state.isAdmin);
  $("#detailEdit").onclick=function(){ closeModal("detailModal"); openForm(r); };
  openModal("detailModal");
}
function cell(k,v){return '<div><div class="k">'+esc(k)+'</div><div class="v">'+esc(v||"-")+'</div></div>';}

// floor rule (mirror of the server): first digit of the room number -> floor
var FLOOR_BY_DIGIT={"1":"الأرضي","2":"الأول","3":"الثاني","4":"الثالث"};
function roomNumber(name){ var s=String(name||""); var m=/\(\s*(\d{3,5})\s*\)/.exec(s)||/(?:^|\D)(\d{4})(?:\D|$)/.exec(s); return m?m[1]:""; }
function floorFromName(name){ var n=roomNumber(name); return n?(FLOOR_BY_DIGIT[n.charAt(0)]||""):""; }

// ---- add/edit ----
function openForm(r){
  r=r||{}; state.photos=splitList(r.PhotoURLs);
  var f=$("#roomForm").elements;
  f.RoomID.value=r.RoomID||""; f.RoomName.value=r.RoomName||"";
  f.Category.value=r.Category||CATEGORIES[0]; f.SourceType.value=r.SourceType||"";
  f.Gender.value=r.Gender||"طلاب"; f.Building.value=r.Building||"";
  var fl=f.Floor; if(r.Floor && ![].some.call(fl.options,function(o){return o.value===r.Floor;})){ var op=document.createElement("option"); op.value=r.Floor; op.textContent=r.Floor; fl.appendChild(op); }
  fl.value=r.Floor||""; f.Capacity.value=r.Capacity||""; f.Status.value=r.Status||"نشطة";
  f.Specs.value=r.Specs||""; f.Notes.value=r.Notes||"";
  state.devices=parseDevices(r.Devices); renderDevices();
  $("#formTitle").textContent = r.RoomID? ("تعديل: "+r.RoomName) : "إضافة قاعة جديدة";
  renderThumbs(); openModal("formModal");
}
function renderDevices(){
  var host=$("#devicesEditor");
  if(!state.devices.length){ host.innerHTML='<div class="hint">لا توجد أجهزة بعد — اضغط «إضافة جهاز».</div>'; return; }
  host.innerHTML=state.devices.map(function(d,i){
    var specs=(d.specs||[]).map(function(p,j){
      return '<div class="spec-row">'
        +'<input placeholder="المواصفة (مثال: الدقة)" data-dev="'+i+'" data-spec="'+j+'" data-k="k" value="'+esc(p[0]||"")+'">'
        +'<input placeholder="القيمة (مثال: 1920×1080)" data-dev="'+i+'" data-spec="'+j+'" data-k="v" value="'+esc(p[1]||"")+'">'
        +'<button type="button" class="mini-del" data-rmspec="'+i+'_'+j+'">×</button></div>';
    }).join("");
    return '<div class="dev-edit"><div class="dev-edit-top">'
      +'<input class="dev-name" placeholder="اسم الجهاز *" data-dev="'+i+'" data-k="name" value="'+esc(d.name)+'">'
      +'<input placeholder="الموديل" data-dev="'+i+'" data-k="model" value="'+esc(d.model)+'">'
      +'<input placeholder="عنوان IP" dir="ltr" data-dev="'+i+'" data-k="ip" value="'+esc(d.ip)+'">'
      +'<button type="button" class="dev-del" data-rmdev="'+i+'">حذف الجهاز</button></div>'
      +'<div class="specs-wrap">'+specs+'</div>'
      +'<button type="button" class="btn-link" data-addspec="'+i+'">＋ مواصفة أخرى</button></div>';
  }).join("");
  $$("#devicesEditor input").forEach(function(el){
    el.addEventListener("input",function(){
      var i=+el.dataset.dev;
      if(el.dataset.spec!=null){ var j=+el.dataset.spec,k=el.dataset.k==="k"?0:1; state.devices[i].specs[j][k]=el.value; }
      else state.devices[i][el.dataset.k]=el.value;
    });
  });
  $$("#devicesEditor [data-rmdev]").forEach(function(b){b.onclick=function(){state.devices.splice(+b.dataset.rmdev,1);renderDevices();};});
  $$("#devicesEditor [data-addspec]").forEach(function(b){b.onclick=function(){state.devices[+b.dataset.addspec].specs.push(["",""]);renderDevices();};});
  $$("#devicesEditor [data-rmspec]").forEach(function(b){b.onclick=function(){var p=b.dataset.rmspec.split("_");state.devices[+p[0]].specs.splice(+p[1],1);renderDevices();};});
}
function addDevice(){ state.devices.push({name:"",model:"",ip:"",specs:[]}); renderDevices(); }
function renderThumbs(){
  $("#photoThumbs").innerHTML=state.photos.map(function(u,i){
    return '<div class="t"><img src="'+esc(u)+'"><button type="button" data-i="'+i+'">×</button></div>';}).join("");
  $$("#photoThumbs .t button").forEach(function(b){b.onclick=function(){state.photos.splice(+b.dataset.i,1);renderThumbs();};});
}
function handleUpload(input){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var b64=reader.result.split(",")[1]; toast("جارٍ رفع الصورة…");
    run("uploadPhotoSvc",$("#roomForm").elements.RoomID.value||"new",file.name,file.type,b64)
      .then(function(res){ if(res&&res.ok){state.photos.push(res.url);renderThumbs();toast("تم رفع الصورة");} else toast("تعذّر رفع الصورة"); })
      .catch(function(){ toast("تعذّر رفع الصورة"); });
    input.value="";
  };
  reader.readAsDataURL(file);
}
function saveRoom(e){
  e.preventDefault();
  var f=$("#roomForm").elements;
  var devices=state.devices.map(function(d){ return {name:(d.name||"").trim(),model:(d.model||"").trim(),ip:(d.ip||"").trim(),
      specs:(d.specs||[]).map(function(p){return [(p[0]||"").trim(),(p[1]||"").trim()];}).filter(function(p){return p[0]||p[1];})}; })
    .filter(function(d){ return d.name||d.model||d.ip||d.specs.length; });
  if(devices.filter(function(d){return !d.name;}).length){ toast("اسم الجهاز مطلوب لكل جهاز"); return; }
  var room={ RoomID:f.RoomID.value, RoomName:f.RoomName.value.trim(), Category:f.Category.value,
    SourceType:f.SourceType.value.trim(), Gender:f.Gender.value, Building:f.Building.value.trim(),
    Floor:f.Floor.value.trim(), Capacity:f.Capacity.value.trim(), Status:f.Status.value,
    Devices:devices.length?JSON.stringify(devices):"", Specs:f.Specs.value.trim(),
    Notes:f.Notes.value.trim(), PhotoURLs:state.photos.join("\n") };
  if(!room.RoomName){ toast("اسم القاعة مطلوب"); return; }
  $("#saveBtn").disabled=true;
  run("saveRoomSvc",room).then(function(res){
    $("#saveBtn").disabled=false;
    if(res&&res.ok){
      var i=-1; state.rooms.forEach(function(x,k){if(x.RoomID===res.room.RoomID)i=k;});
      if(i>=0) state.rooms[i]=res.room; else state.rooms.push(res.room);
      closeModal("formModal"); renderKPIs(); renderTabs(); render(); toast("تم الحفظ ✓");
    } else toast(res&&res.error==="forbidden"?"ليست لديك صلاحية التعديل":"تعذّر الحفظ");
  }).catch(function(){ $("#saveBtn").disabled=false; toast("تعذّر الاتصال بالخادم"); });
}

function openModal(id){$("#"+id).classList.add("show");}
function closeModal(id){$("#"+id).classList.remove("show");}

  monitor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  cpu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg>',
  twin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M11 7h4a2 2 0 0 1 2 2v4M7 11v4a2 2 0 0 0 2 2h4"/></svg>'
};

function boot(){
  wireLogo($("#logo-sru"),LOGO_BASE+"logo-sru.png","جامعة سليمان الراجحي");
  wireLogo($("#logo-ictd"),LOGO_BASE+"logo-ictd.png","الإدارة التنفيذية للاتصالات وتقنية المعلومات");
  wireLogo($("#logo-itoc"),LOGO_BASE+"logo-itoc.png","ITOC");
  $("#gate-itoc").src=LOGO_BASE+"logo-itoc.png"; $("#gate-itoc").onerror=function(){this.style.display="none";};
  $("#itoc-link").href=ITOC_HUB;
  $("#appMark").innerHTML=ICN.twin;
  ["q","fBuilding","fGender","fStatus"].forEach(function(id){
    var el=$("#"+id); el.addEventListener(id==="q"?"input":"change",render);});
  var sv=loadView(); if(sv==="console"||sv==="explorer"||sv==="gallery") state.view=sv;
  $$(".vbtn").forEach(function(b){ b.onclick=function(){ setView(b.dataset.view); }; });
  $("#fSort").addEventListener("change",render);
  $("#addRoomBtn").onclick=function(){openForm(null);};
  $("#addDeviceBtn").onclick=addDevice;
  $("#roomForm").addEventListener("submit",saveRoom);
  // suggest the floor from the room number while typing (only if no floor chosen yet)
  $("#roomForm").elements.RoomName.addEventListener("input",function(){
    var fl=$("#roomForm").elements.Floor, d=floorFromName(this.value);
    if(d && !fl.value){ fl.value=d; fl.dataset.auto="1"; }
    else if(fl.dataset.auto==="1" && d!==fl.value){ fl.value=d; if(!d) delete fl.dataset.auto; }
  });
  $("#roomForm").elements.Floor.addEventListener("change",function(){ delete this.dataset.auto; });
  $("#photoInput").addEventListener("change",function(){handleUpload(this);});
  $$("[data-close]").forEach(function(b){b.onclick=function(){closeModal(b.dataset.close);};});
  $$(".modal-bg").forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove("show");};});
  bootstrap();
}
if(document.readyState!=="loading") boot(); else document.addEventListener("DOMContentLoaded",boot);
})();
</script>
