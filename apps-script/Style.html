<style>
/* SRU Tech Background · Network v1.0
   Approved pattern (Coffee with IT v3.4, option C «شبكة متصلة متحركة», 2026-10-22).
   .sru-tech-bg       -> header bands  (purple -> blue gradient)
   .sru-tech-bg-dark  -> footers       (dark purple)
   Animated network of white nodes + light-blue links drifting left over 40s.
   Motion disabled for prefers-reduced-motion and removed when printing. */

.sru-tech-bg,
.sru-tech-bg-dark {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.sru-tech-bg {
  background: linear-gradient(110deg, #501e8c 0%, #4a1f8a 45%, #2b3f9e 100%);
}
.sru-tech-bg-dark {
  background: linear-gradient(110deg, #3a1464 0%, #2e2a80 100%);
}

/* network overlay: a 520x200 SVG tile of nodes + lines, tiled and drifting */
.sru-tech-bg::before,
.sru-tech-bg-dark::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='520' height='200' viewBox='0 0 520 200'>\
<g stroke='%238fd3ff' stroke-width='1' opacity='0.35'>\
<line x1='30' y1='40' x2='150' y2='90'/><line x1='150' y1='90' x2='250' y2='30'/>\
<line x1='250' y1='30' x2='380' y2='80'/><line x1='380' y1='80' x2='500' y2='40'/>\
<line x1='30' y1='40' x2='90' y2='160'/><line x1='90' y1='160' x2='210' y2='150'/>\
<line x1='210' y1='150' x2='250' y2='30'/><line x1='210' y1='150' x2='330' y2='170'/>\
<line x1='330' y1='170' x2='380' y2='80'/><line x1='330' y1='170' x2='470' y2='150'/>\
<line x1='470' y1='150' x2='500' y2='40'/><line x1='90' y1='160' x2='150' y2='90'/>\
</g>\
<g fill='%23ffffff'>\
<circle cx='30' cy='40' r='3'/><circle cx='150' cy='90' r='3.5'/><circle cx='250' cy='30' r='3'/>\
<circle cx='380' cy='80' r='3.5'/><circle cx='500' cy='40' r='3'/><circle cx='90' cy='160' r='3'/>\
<circle cx='210' cy='150' r='3.5'/><circle cx='330' cy='170' r='3'/><circle cx='470' cy='150' r='3'/>\
</g></svg>");
  background-size: 520px 200px;
  background-repeat: repeat;
  animation: sru-net-drift 40s linear infinite;
  will-change: background-position;
}

@keyframes sru-net-drift {
  from { background-position: 0 0; }
  to   { background-position: -520px 0; }
}

@media (prefers-reduced-motion: reduce) {
  .sru-tech-bg::before,
  .sru-tech-bg-dark::before { animation: none; }
}

@media print {
  .sru-tech-bg, .sru-tech-bg-dark { background: #501e8c !important; }
  .sru-tech-bg::before, .sru-tech-bg-dark::before { display: none !important; }
}

/* SRU Rooms Digital Twin — app styles (v1.0) */
:root{
  --purple:#501e8c; --purple-dark:#3a1464; --purple-light:#f0ebf8;
  --blue:#0a6eaa; --blue-light:#e6f3fa;
  --ink:#241436; --muted:#6b5a80;
  --bg:#f7f5fb; --border:rgba(80,30,140,.12);
  --radius:4px; --card-radius:10px;
  --ok:#1e7d4f; --off:#b02a37;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Cairo",Tahoma,Arial,sans-serif; direction:rtl;
  background:var(--bg); color:var(--ink); line-height:1.6;
}
a{color:var(--blue);text-decoration:none}
.en{direction:ltr; unicode-bidi:isolate; display:inline-block}

/* ---- brand bar (white) : SRU right, ICTD left, 40px ---- */
.brandbar{
  background:#fff; display:flex; align-items:center; justify-content:space-between;
  padding:10px 22px; border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--purple),var(--blue)) 1;
}
.brandbar img{height:40px;width:auto;object-fit:contain}
.brandbar .logo-fallback{font-weight:700;color:var(--purple);font-size:14px}

/* ---- header band (tech-bg) ---- */
.appheader{color:#fff;padding:22px}
.appheader .wrap{display:flex;align-items:center;gap:16px;max-width:1200px;margin:0 auto}
.appheader .mark{height:60px;width:60px;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border-radius:14px;flex:0 0 auto}
.appheader .mark svg{width:34px;height:34px;color:#fff}
.appheader h1{margin:0;font-size:22px;font-weight:800}
.appheader p{margin:2px 0 0;font-size:13px;opacity:.9}
.appheader .who{margin-inline-start:auto;text-align:left;font-size:12px;opacity:.95}
.appheader .who button{margin-top:4px}

/* ---- layout ---- */
.container{max-width:1200px;margin:0 auto;padding:18px 22px 40px}

/* ---- category tabs ---- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.tab{
  background:#fff;border:1px solid var(--border);border-radius:999px;
  padding:8px 16px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
  display:flex;align-items:center;gap:8px;transition:.15s;
}
.tab:hover{border-color:var(--purple)}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.tab .count{background:rgba(0,0,0,.12);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.tab.active .count{background:rgba(255,255,255,.25)}

/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters input,.filters select{
  font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--border);
  border-radius:var(--radius);background:#fff;color:var(--ink);min-width:150px}
.filters .search{flex:1;min-width:200px}
.spacer{flex:1}
.btn{font-family:inherit;font-size:14px;border-radius:var(--radius);padding:8px 16px;
  cursor:pointer;border:1px solid var(--purple);display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-dark)}
.btn-secondary{background:#fff;color:var(--purple)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn svg{width:16px;height:16px}

/* ---- room grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--card-radius);
  overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 6px 20px rgba(80,30,140,.14);transform:translateY(-2px)}
.card .thumb{height:140px;background:var(--purple-light) center/cover no-repeat;
  display:grid;place-items:center;color:var(--purple);position:relative}
.card .thumb svg{width:42px;height:42px;opacity:.5}
.card .body{padding:12px 14px}
.card .title{font-weight:700;font-size:15px;margin:0 0 4px}
.card .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}
.card .meta span{display:inline-flex;align-items:center;gap:4px}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:var(--purple);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:999px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.pill.on{background:#e6f6ee;color:var(--ok)}
.pill.off{background:#fdeaec;color:var(--off)}
.tech-count{position:absolute;top:8px;inset-inline-end:8px;background:rgba(255,255,255,.9);
  color:var(--purple);font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;
  display:flex;align-items:center;gap:4px}
.tech-count svg{width:12px;height:12px}

.empty{text-align:center;color:var(--muted);padding:50px 20px}

/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(36,20,54,.55);display:none;
  align-items:flex-start;justify-content:center;padding:30px 16px;z-index:60;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;overflow:hidden}
.modal .mhead{color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.modal .mhead h2{margin:0;font-size:18px}
.modal .mhead .x{background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;
  border-radius:8px;cursor:pointer;font-size:18px}
.modal .mbody{padding:20px;max-height:70vh;overflow:auto}

/* photo gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.gallery img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
.gallery .ph{height:110px;border:1px dashed var(--border);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
.detail-grid .k{font-size:12px;color:var(--muted)}
.detail-grid .v{font-weight:700;font-size:14px}
.section-title{font-weight:800;font-size:14px;color:var(--purple);margin:14px 0 8px;
  display:flex;align-items:center;gap:6px}
.section-title svg{width:16px;height:16px}
.devices{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--purple-light);color:var(--purple);border-radius:999px;padding:4px 12px;font-size:13px}
/* device cards in detail view */
.dev-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.dev-head{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--purple);margin-bottom:6px}
.dev-head svg{width:16px;height:16px}
.dev-card .specs-table td{border-bottom:1px solid var(--purple-light)}

/* device editor (form) */
.dev-edit{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.dev-edit-top{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:center}
.dev-edit input{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
.dev-edit .dev-del{background:#fdeaec;color:var(--off);border:1px solid #f3c2c7;border-radius:var(--radius);padding:7px 10px;cursor:pointer;font-size:12px;font-family:inherit}
.specs-wrap{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.spec-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.spec-row input{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
.mini-del{background:#fdeaec;color:var(--off);border:0;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px}
.btn-link{background:none;border:0;color:var(--blue);cursor:pointer;font-family:inherit;font-size:13px;padding:6px 0;margin-top:6px}
.specs-table{width:100%;border-collapse:collapse;font-size:13px}
.specs-table td{padding:6px 10px;border-bottom:1px solid var(--border)}
.specs-table td:first-child{color:var(--muted);width:40%}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);
  border-radius:var(--radius);background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:70px}
.hint{font-size:11px;color:var(--muted)}
.form-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
.upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs .t{position:relative}
.thumbs img{width:70px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.thumbs .t button{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--off);color:#fff;
  border:0;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}

/* ---- sign-in gate (ITOC) ---- */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card2{background:#fff;border-radius:16px;max-width:430px;width:100%;overflow:hidden;
  box-shadow:0 20px 60px rgba(36,20,54,.35)}
.gate .top{color:#fff;padding:26px 24px;text-align:center}
.gate .top .itoc{height:48px;width:auto;margin-bottom:14px;background:#fff;
  padding:10px 18px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.18);box-sizing:content-box}
.gate .top h2{margin:0;font-size:20px;font-weight:800}
.gate .body2{padding:24px;text-align:center}
.gate .body2 p{color:var(--muted);font-size:14px;margin:0 0 6px}
.gate .dom{display:inline-block;background:var(--purple-light);color:var(--purple);font-weight:800;
  padding:4px 12px;border-radius:999px;margin:8px 0 18px;direction:ltr}
.gate .gbtn{display:flex;justify-content:center;margin-top:8px;min-height:44px}
.gate .err{color:var(--off);font-size:13px;margin-top:12px;min-height:18px}
.gate .foot{font-size:11px;color:var(--muted);margin-top:16px}

/* ---- footer (tech-bg-dark) ---- */
.appfooter{color:#fff;margin-top:30px}
.appfooter .wrap{max-width:1200px;margin:0 auto;padding:18px 22px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.appfooter .itoc img{height:30px;background:#fff;padding:6px 12px;border-radius:10px;box-sizing:content-box;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.appfooter .vbadge{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;
  font-size:12px;font-weight:700;direction:ltr}
.appfooter .mid{font-size:12px;opacity:.85;text-align:center;flex:1;min-width:160px}

.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;
  z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}

@media(max-width:620px){
  .detail-grid,.form-grid{grid-template-columns:1fr}
  .appheader .who{width:100%;text-align:right;margin:8px 0 0}
}
@media print{
  .brandbar,.filters,.tabs,.btn,.appheader .who,.gate{display:none!important}
}

/* ===== v2.1 — switchable views ===================================== */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:6px 0 18px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2}
.kpi .n{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:#a3222f}

.viewbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.viewswitch{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.vbtn{font-family:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--ink);
  border-radius:7px;padding:9px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.vbtn svg{width:18px;height:18px}
.vbtn:hover{background:var(--purple-light)}
.vbtn[aria-pressed="true"]{background:var(--purple);color:#fff}
.sortlbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.sortlbl select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--ink)}

/* category colour tokens (text labels always present; lightness differs) */
.c-lec{--cbg:#efe7fb;--cfg:#501e8c;--cbd:#7a4bc0}
.c-exam{--cbg:#fdecdd;--cfg:#9a4a06;--cbd:#d9822b}
.c-study{--cbg:#e6f3fa;--cfg:#0a5a8c;--cbd:#0a6eaa}
.c-class{--cbg:#e3f4ee;--cfg:#1b6b4a;--cbd:#2f9a6c}
.c-meet{--cbg:#eef0f4;--cfg:#3c4657;--cbd:#6b7689}
.c-other{--cbg:#f3f1f6;--cfg:#4a3f58;--cbd:#8a7aa0}
.cchip{display:inline-block;background:var(--cbg);color:var(--cfg);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.spill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.spill.on{background:#e6f6ee;color:#17663f}.spill.off{background:#fdeaec;color:#a3222f}

/* A · console table */
.tcard{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.twrap{overflow-x:auto}
.rtable{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.rtable th{background:var(--purple-light);color:var(--purple-dark);text-align:right;padding:11px 14px;font-weight:800;white-space:nowrap}
.rtable td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.rtable tr:hover td{background:#faf8fd}
.rtable .muted{color:var(--muted)}
.rtable .ltr{direction:ltr;text-align:right}
.linkbtn{font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:right}
.linkbtn:hover{color:var(--purple);text-decoration:underline}

/* B · building explorer */
.bldtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.btab{font-family:inherit;font-size:14px;font-weight:700;background:#fff;color:var(--ink);border:1px solid var(--border);
  border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btab .n{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--purple-light);color:var(--purple)}
.btab[aria-pressed="true"]{background:var(--purple);color:#fff;border-color:var(--purple)}
.btab[aria-pressed="true"] .n{background:rgba(255,255,255,.25);color:#fff}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.bhead h2{margin:0;font-size:20px;font-weight:800}
.bhead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.floorlbl{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.floorlbl select{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--ink);min-width:160px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:12px}
.legend .cchip{border:1px solid var(--cbd)}
.legend .inact{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.legend .inact i{width:14px;height:14px;border-radius:3px;border:2px dashed #8a7aa0;display:inline-block}
.plan{background:#fff;border:2px solid var(--purple-dark);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wing{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:inherit;min-width:104px;min-height:92px;box-sizing:border-box;border-radius:8px;padding:9px 10px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:right;
  background:var(--cbg);color:var(--cfg);border:1px solid var(--cbd);border-top:4px solid var(--cbd)}
.tile:hover{filter:brightness(.97);outline:2px solid var(--cbd);outline-offset:1px}
.tile .tn{font-size:13px;font-weight:800;line-height:1.35}
.tile .tc{font-size:12px;display:inline-flex;align-items:center;gap:4px}
.tile .tc svg{width:13px;height:13px}
.tile.inactive{background:#f7f5fb;color:var(--muted);border:2px dashed #8a7aa0}
.corridor{height:34px;border-radius:6px;background:#ece6f6;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700}
.bstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.bstat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.bstat .l{font-size:12px;color:var(--muted)}.bstat .v{font-size:22px;font-weight:800}

/* C · gallery */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.gcard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
