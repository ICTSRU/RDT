<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التوأم الرقمي للقاعات الدراسية — جامعة سليمان الراجحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sru-tech-bg.css?v=2.2">
<style>
  body{font-family:"Cairo",Tahoma,Arial,sans-serif;direction:rtl;margin:0;background:#f7f5fb;color:#241436;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:16px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(36,20,54,.25);text-align:center}
  .top{color:#fff;padding:28px 24px}
  .top img{height:46px;background:#fff;padding:9px 16px;border-radius:12px;margin-bottom:12px}
  .top h1{margin:0;font-size:20px;font-weight:800}
  .body{padding:26px 24px}
  .body p{color:#6b5a80;font-size:14px;margin:0 0 18px}
  a.btn{display:inline-block;background:#501e8c;color:#fff;text-decoration:none;font-weight:700;
    padding:12px 26px;border-radius:8px;font-size:15px}
  a.btn:hover{background:#3a1464}
  .ver{font-size:11px;color:#6b5a80;margin-top:16px;direction:ltr}
</style>
</head>
<body>
  <div class="box">
    <div class="top sru-tech-bg">
      <img id="itoc" src="assets/logos/logo-itoc.png" alt="ITOC">
      <h1>التوأم الرقمي للقاعات الدراسية</h1>
    </div>
    <div class="body">
      <p>تُفتح المنصة عبر خدمة الجامعة الآمنة (الدخول بحساب <span dir="ltr">@sr.edu.sa</span>).</p>
      <a class="btn" id="open" href="#">افتح المنصة</a>
      <div class="ver">Rooms Digital Twin · v2.2</div>
    </div>
  </div>
<script src="config.js?v=2.2"></script>
<script>
  var url=(window.RDT_CONFIG&&window.RDT_CONFIG.APP_URL)||"";
  var a=document.getElementById("open");
  if(url){ a.href=url; setTimeout(function(){ location.href=url; }, 900); }
  else { a.textContent="لم يُضبط رابط المنصة بعد"; }
</script>
</body>
</html>
